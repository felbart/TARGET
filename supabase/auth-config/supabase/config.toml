# Scoped config: only these Auth properties are pushed, other services stay unchanged.
project_id = "targetfb-auth"

[auth]
site_url = "https://targetfb.netlify.app"
additional_redirect_urls = ["https://targetfb.netlify.app/auth/callback", "http://localhost:5173/auth/callback", "http://127.0.0.1:5173/auth/callback", "http://localhost:3000/auth/callback"]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# This maps to the email provider being enabled. Global auth.enable_signup closes registration.
enable_signup = true
enable_confirmations = true
